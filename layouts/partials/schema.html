{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "name": {{ .Site.Params.companyName | jsonify }},
      "url": {{ .Site.Params.companyURL | jsonify }},
      "email": {{ .Site.Params.contactEmail | jsonify }},
      "logo": {{ "/images/brand/logo.png" | absURL | jsonify }}
    },
    {
      "@type": "WebSite",
      "name": {{ .Site.Title | jsonify }},
      "url": {{ .Site.BaseURL | jsonify }},
      "description": {{ .Site.Params.description | jsonify }},
      "inLanguage": "ja",
      "publisher": {
        "@type": "Organization",
        "name": {{ .Site.Params.companyName | jsonify }}
      }
    },
    {
      "@type": "SoftwareApplication",
      "name": {{ .Site.Params.productName | jsonify }},
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": {{ .Site.Params.description | jsonify }},
      "url": {{ .Site.BaseURL | jsonify }},
      "offers": {
        "@type": "Offer",
        "url": {{ .Site.Params.paperformInquiry | jsonify }},
        "priceCurrency": "JPY",
        "availability": "https://schema.org/InStock"
      }
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {{- range $i, $item := .Site.Data.site.faq -}}
        {{- if $i }},{{ end }}
        {
          "@type": "Question",
          "name": {{ .q | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ .a | jsonify }}
          }
        }
        {{- end }}
      ]
    }
  ]
}
</script>
{{ else if and (eq .Section "blog") .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "description": {{ or .Description .Summary | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02" | jsonify }},
  "mainEntityOfPage": {{ .Permalink | jsonify }},
  "author": {
    "@type": "Organization",
    "name": {{ .Site.Params.companyName | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ .Site.Params.companyName | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ "/images/brand/logo.png" | absURL | jsonify }}
    }
  }
  {{- with or .Params.coverLocal .Params.cover -}},
  "image": {{ . | absURL | jsonify }}
  {{- end }}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "ホーム", "item": {{ .Site.BaseURL | jsonify }} },
    { "@type": "ListItem", "position": 2, "name": "Blog", "item": {{ "/blog/" | absURL | jsonify }} },
    { "@type": "ListItem", "position": 3, "name": {{ .Title | jsonify }}, "item": {{ .Permalink | jsonify }} }
  ]
}
</script>
{{ else if and (eq .Section "news") .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": {{ .Title | jsonify }},
  "description": {{ or .Description .Summary | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02" | jsonify }},
  "mainEntityOfPage": {{ .Permalink | jsonify }},
  "author": {
    "@type": "Organization",
    "name": {{ .Site.Params.companyName | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ .Site.Params.companyName | jsonify }}
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "ホーム", "item": {{ .Site.BaseURL | jsonify }} },
    { "@type": "ListItem", "position": 2, "name": "お知らせ", "item": {{ .Permalink | jsonify }} }
  ]
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "ホーム",
      "item": {{ .Site.BaseURL | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ .Title | jsonify }},
      "item": {{ .Permalink | jsonify }}
    }
  ]
}
</script>
{{ end }}
