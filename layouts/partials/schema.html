{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "name": {{ .Site.Params.companyName | jsonify }},
      "url": {{ .Site.Params.companyURL | jsonify }},
      "email": {{ .Site.Params.contactEmail | jsonify }}
    },
    {
      "@type": "WebSite",
      "name": {{ .Site.Title | jsonify }},
      "url": {{ .Site.BaseURL | jsonify }},
      "description": {{ .Site.Params.description | jsonify }},
      "inLanguage": "ja",
      "publisher": {
        "@type": "Organization",
        "name": {{ .Site.Params.companyName | jsonify }}
      }
    },
    {
      "@type": "SoftwareApplication",
      "name": {{ .Site.Params.productName | jsonify }},
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": {{ .Site.Params.description | jsonify }},
      "offers": {
        "@type": "Offer",
        "url": {{ .Site.Params.paperformInquiry | jsonify }},
        "priceCurrency": "JPY",
        "availability": "https://schema.org/InStock"
      }
    }
  ]
}
</script>
{{ else }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "ホーム",
      "item": {{ .Site.BaseURL | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ .Title | jsonify }},
      "item": {{ .Permalink | jsonify }}
    }
  ]
}
</script>
{{ end }}
