<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Params.productName }} ホーム">
      <img class="brand__logo" src="{{ "/images/brand/logo-sm.webp" | relURL }}" width="150" height="34" alt="{{ .Site.Params.productName }}">
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" autocomplete="off">
    <label for="nav-toggle" class="nav-toggle-btn" aria-label="メニュー">
      <span></span><span></span><span></span>
    </label>

    <nav class="nav" aria-label="メイン">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      <a href="{{ .Site.Params.paperformDownload }}" rel="noopener noreferrer" target="_blank">説明書</a>
      <a href="{{ .Site.Params.companyURL }}" rel="noopener noreferrer" target="_blank">運営会社</a>
      <a href="{{ .Site.Params.privacyURL }}" rel="noopener noreferrer" target="_blank">プラポリ</a>
      <a class="btn btn--primary btn--sm" href="{{ .Site.Params.paperformDownload }}" rel="noopener noreferrer" target="_blank">資料請求<span class="material-icons btn__icon" aria-hidden="true">file_download</span></a>
      <a class="btn btn--cta btn--sm" href="{{ .Site.Params.paperformWebinar }}" rel="noopener noreferrer" target="_blank">ウェビナー予約</a>
    </nav>
  </div>
</header>
