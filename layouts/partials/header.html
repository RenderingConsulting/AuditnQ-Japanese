<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Params.productName }} ホーム">
      <img class="brand__mark" src="{{ .Site.Params.favicon | relURL }}" width="32" height="32" alt="">
      <span>{{ .Site.Params.productName }}</span>
    </a>
    <nav class="nav" aria-label="メイン">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      <a class="btn btn--cta btn--sm" href="{{ .Site.Params.paperformDownload }}" rel="noopener noreferrer" target="_blank">資料請求</a>
      <a class="btn btn--ghost btn--sm" href="{{ .Site.Params.paperformWebinar }}" rel="noopener noreferrer" target="_blank">ウェビナー予約</a>
    </nav>
  </div>
</header>
