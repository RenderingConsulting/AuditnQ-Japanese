<section class="cta-band">
  <div class="wrap">
    <p class="cta-band__lead">AuditnQに少しでもご興味がございましたら<br>お気軽にお問い合わせください</p>
    <div class="cta-band__grid">
      <article class="cta-card">
        <div class="cta-card__media">
          <img src="{{ "/images/cta/download.webp" | relURL }}" alt="AuditnQお役立ち資料のイメージ" width="1200" height="630" loading="lazy">
        </div>
        <div class="cta-card__body">
          <p class="cta-card__eyebrow">Download</p>
          <h2>お役立ち資料</h2>
          <p>AuditnQのサービス概要が3分で分かる資料をダウンロードできます。</p>
          <a class="btn btn--primary" href="{{ .Site.Params.paperformDownload }}" rel="noopener noreferrer" target="_blank">資料請求<span class="icon icon--download btn__icon" aria-hidden="true"></span></a>
        </div>
      </article>
      <article class="cta-card">
        <div class="cta-card__media">
          <img src="{{ "/images/cta/webinar.webp" | relURL }}" alt="ウェビナーのイメージ" width="1200" height="630" loading="lazy">
        </div>
        <div class="cta-card__body">
          <p class="cta-card__eyebrow">Webinar</p>
          <h2>ウェビナー</h2>
          <p>サービス概要や実際の画面についてご説明します。ご質問も可能なので是非ご参加ください。</p>
          <a class="btn btn--cta" href="{{ .Site.Params.paperformWebinar }}" rel="noopener noreferrer" target="_blank">ウェビナーに参加</a>
        </div>
      </article>
    </div>
  </div>
</section>
