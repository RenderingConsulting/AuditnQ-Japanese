features:
  - id: "01"
    title: "初回選定からリスク分析、監査業務の統合管理"
    body: "契約前の段階から、複数の委託先候補の評価情報を管理し、選定支援まで一元的に行います。確定した委託先に再委託先があれば一緒に管理します。可視化された委託先のリスクを分析し、定期もしくは臨時で行われる監査についても、対象の委託先/再委託先選定やプロセス管理、個別評価など一連の業務支援を実現します。"
  - id: "02"
    title: "導入・展開・運用負荷を最小化"
    body: "企業間の情報のやり取りについて、既存のExcel（エクセル）資産の利用も可能なサービスです。アップロードするだけで委託先からの回答が登録されます。社内外の多くのユーザーに対して大きな業務変更を強いることがなく、同時に教育コストも低減できるため、安心して長期的にご利用いただくことができます。"
  - id: "03"
    title: "サプライチェーン全体のリスク分析"
    body: "一元化/可視化された委託先/再委託先群に対し、委託件数/支払費用の偏りや地域的な集中の分析が可能です。親会社を含めたグループ会社や関連会社、委託先など、複数社での利用を前提としたサービス体系にしているので、企業単体だけではなく、企業グループのサプライチェーン全体の強靱化を図れます。"

functions:
  - id: regular
    number: 1
    title: "定期/臨時監査支援"
    short: "定期監査支援"
    body: "主に半年もしくは１年ごとに行われる「監査業務」を支援します。当該監査で対象とする個別契約の抽出・選定から、主管部門と役割分担しながらの委託先への情報提供依頼、回収状況や評価状況のプロセス管理などを支援します。当然、定期のみならず、臨時での監査も行うことが可能です。"
  - id: individual
    number: 2
    title: "個別契約管理"
    body: "選定の段階から、契約の主管部門や担当者、調査票の種類、複数の候補社への情報提供依頼と回収、最終的に契約をする委託先や契約日などの関連情報を一元的に管理します。"
  - id: excel
    number: 3
    title: "エクセルフォーマット設定"
    short: "Excelフォーマット設定"
    body: "Excel（エクセル）で作成されている既存の調査票を本サービスに取り込み、必要な設定を行います。Excel（エクセル）を活用することで、情報のやり取りに関するサービスの展開難易度・運用負荷の低減と、情報の適切な一元管理によるリスク低減と業務効率化を両立します。"
  - id: share
    number: 4
    title: "共有設定"
    body: "選定時の委託先評価や定期監査時には、さまざまな部門がそれぞれの立場で共同作業を行うことになります。また社外の関係会社や委託先企業とも役割分担に応じたやり取りが発生します。本サービスでは、それら役割と関連する情報に応じて、アカウントごとの共有の範囲を変更することが可能です。"
  - id: answer
    number: 5
    title: "回答一覧 / 比較支援"
    body: "選定時には複数の委託先候補社からそれぞれの回答情報を収集し、実際に契約した委託先からは、一定期間後の定期監査時に改めて回答情報を取得することになることから、本サービスには複数会社および同一会社の時期の異なる回答情報が一元管理されます。これらを適切に管理して表現することで、効率的な比較検討と厳格なリスク管理を支援します。"
  - id: outbound-in
    number: 6
    title: "第三者評価連携"
    body: "委託先の自己申告だけでなく、Netskope社が提供する80,000種類以上のクラウドサービス評価データを自動取得。CCIスコアによる客観的なセキュリティ評価で、委託先選定の判断をデータでサポートします。"
    home: false
  - id: multicompany
    number: 7
    title: "複数会社管理"
    body: "サプライチェーン全体への対応を実現するため、企業単体ではなく複数企業での利用・管理を前提としたサービスとしており、企業グループ全体にわたる適切なリスク把握を実現します。"
  - id: nth-party
    number: 8
    title: "再委託先（Nth Party）管理"
    body: "直接の委託先（3rd Party）だけではなく、再委託先以降（Nth Party）の管理も実現可能です。サプライチェーン全体の情報を一元管理することで、これまでは把握できていなかったサプライチェーンリスクを認識することが可能になります。"
  - id: analyze
    number: 9
    title: "リスク分析"
    body: "委託先/再委託先を対象に、契約集中（数/費用）や場所集中（半径20km以内のクラスタ化等）を可視化することが可能です。これにより与信管理や災害に対する備えが可能になります。"
  - id: security
    number: 10
    title: "各種セキュリティ機能"
    body: "国内外の大企業での運用に耐え得るエンタープライズレベルのセキュリティ機能/ガバナンス機能を具備しています。またISMSは取得済みであり、SOC2 Type2取得の準備も進めています（2026年8月現在）"

# ホームは現行どおり 9 枠（第三者評価連携は /service 詳細のみ）
home_functions:
  - regular
  - individual
  - excel
  - share
  - answer
  - multicompany
  - nth-party
  - analyze
  - security

workflow:
  - id: "1"
    title: "委託先の選定開始"
    body: "委託先の選定を行うタイミングから、契約・プロジェクトの概要や主管部門や担当者、利用する調査票の種類など必要な情報管理を開始します。主管部門の担当者との共有機能を利用して協力しながら、委託先からの回答を収集します。事前に本サービスに登録・設定することで、既存の調査票（Excel / エクセル）を、利用することも可能です。"
  - id: "2"
    title: "委託先の契約決定"
    body: "各社から回答を収集し、個別回答の一覧や、複数社の回答を並列比較して検討を進めます。調査票（Excel / エクセル）をアップロードすることで、本サービス上に各社の回答情報の一括登録も可能です。最終的に選定された委託先の回答を、契約期日や委託先の担当者情報と共に管理します。"
  - id: "3"
    title: "委託先/再委託先のリスク分析"
    body: "契約中の委託先や再委託先（Nth Party）についてリスク分析を行います。例えば、ある企業への直接委託と再委託を合わせた結果、契約数もしくは費用の集中度合いが過剰ではないかどうかを確認したり、自社へのサービス提供拠点がある地域へ偏在していることにより災害リスクが生じていないか、などをビジュアルと共に確認し、対策を講じます。"
  - id: "4"
    title: "定期（臨時）監査"
    body: "１年または半年毎に行われる監査時には、まずは対象となる契約を、期日や取り扱う情報の種別などの条件で抽出して確定します。その後、監査対象となった契約の委託先に対して、主管部門との共有機能を利用して協力しながら、調査票への最新の回答を改めて回収し、過去回答と並列比較しながら評価していきます。全体の進捗などプロセス管理を行いながら、監査対象すべての契約の評価を実施・管理することで、継続的なリスク低減の活動を支援します。"

faq:
  - q: "運用開始までのプロセスを教えてください。"
    a: "まずはお打ち合わせにて、貴社の課題にお役に立てそうなシステムなのかをご確認ください。もしお役に立てそうでしたら、貴社のご利用開始に至るまでのプロセスに合わせ、様々なご提案をさせていただきます。ご契約後には、定期的なお打ち合わせを通して、貴社の実運用に乗るまでの支援をさせていただきます。"
  - q: "料金や課金体系を教えてください。"
    a: "初期費用と月額利用料の組み合わせになります。基本的には自社内への展開や関連会社などへの展開に負担がないような課金体系にしています。詳細についてはお打ち合わせ時に、ご要望やご利用内容にあわせて、ご提案させていただきます。"
  - q: "この製品は委託元の企業向けですか？弊社は委託先として回答をする立場なのですが？"
    a: "はい。このAuditnQは「委託元」で「委託先」を管理する企業様向けに設計されております。「委託先」の企業様向けのシステムも鋭意開発中です。期待してお待ちください。もしよろしければご要望もお聞かせください。フォームからのお問い合わせをお待ちいたします。"
  - q: "セキュリティは担保されていますか？"
    a: "ISMS（ISO27001）を取得しています。SOC2 Type2も取得手続き中です。今後も継続的に組織的にも機能的にもセキュリティレベルの向上を行ってまいります。"
